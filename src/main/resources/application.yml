spring:
  application:
    name: mstan-shop-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:lwQLrBbv4jMJwj1shhCqTGoCgmwNzu4QTVcVTysXpXP}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:10485760}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      presign-expiration-seconds: ${R2_PRESIGN_EXPIRATION_SECONDS:300}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    oauth-redirect-url: ${FRONTEND_OAUTH_REDIRECT_URL:http://localhost:5173/oauth2/redirect}
  mail:
    from: ${MAIL_FROM:no-reply@mstan-shop.com}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@mstan-shop.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
  stock:
    low-threshold: ${STOCK_LOW_THRESHOLD:5}
    alert-cron: ${STOCK_ALERT_CRON:0 0 8 * * *}
  payment:
    campay:
      base-url: ${CAMPAY_BASE_URL:https://demo.campay.net/api}
      api-key: ${CAMPAY_API_KEY:}
      webhook-key: ${CAMPAY_WEBHOOK_KEY:}
  notification:
    genuka:
      base-url: ${GENUKA_BASE_URL:https://wa.genuka.com/api/v1}
      api-key: ${GENUKA_API_KEY:}
      connection-id: ${GENUKA_CONNECTION_ID:}
      webhook-secret: ${GENUKA_WEBHOOK_SECRET:}
