<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Alerte stock bas</title></head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;max-width:600px;">
                <tr><td th:insert="~{email/fragments :: header}"></td></tr>
                <tr>
                    <td style="padding:32px;font-family:Helvetica,Arial,sans-serif;color:#333333;">
                        <h1 style="font-size:20px;margin:0 0 8px;">⚠ Alerte stock bas</h1>
                        <p style="font-size:14px;line-height:1.6;margin:0 0 24px;">
                            Les produits/variantes suivants sont sous le seuil de stock défini :
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #eeeeee;">
                            <tr>
                                <th style="text-align:left;padding:8px 0;border-bottom:1px solid #eeeeee;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#888888;">Produit</th>
                                <th style="text-align:right;padding:8px 0;border-bottom:1px solid #eeeeee;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#888888;">Stock</th>
                                <th style="text-align:right;padding:8px 0;border-bottom:1px solid #eeeeee;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#888888;">Seuil</th>
                            </tr>
                            <tr th:each="item : ${items}">
                                <td style="padding:12px 0;border-bottom:1px solid #eeeeee;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#333333;">
                                    <span th:text="${item.productName}">Produit</span>
                                    <span th:if="${item.colorLabel}" style="color:#888888;" th:text="'(' + ${item.colorLabel} + ')'"></span>
                                </td>
                                <td style="padding:12px 0;border-bottom:1px solid #eeeeee;text-align:right;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#c62828;font-weight:bold;">
                                    <span th:text="${item.currentStock}">0</span>
                                </td>
                                <td style="padding:12px 0;border-bottom:1px solid #eeeeee;text-align:right;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#888888;">
                                    <span th:text="${item.threshold}">0</span>
                                </td>
                            </tr>
                        </table>

                        <table th:replace="~{email/fragments :: button(${adminUrl}, 'Voir le catalogue')}"></table>

                        <p style="font-size:14px;line-height:1.6;margin:24px 0 0;">
                            L'équipe MSTAN Shop
                        </p>
                    </td>
                </tr>
                <tr><td th:insert="~{email/fragments :: footer}"></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
